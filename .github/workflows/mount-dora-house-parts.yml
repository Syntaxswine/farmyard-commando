name: Mount Dora house parts
on:
  pull_request:
    branches: [main]
    paths:
      - 'maps/mount-dora/**'
      - 'tools/maps/**'
      - 'tools/*mount-dora-workshop.mjs'
      - 'tests/maps/house-parts.test.mjs'
      - 'sites/tactical-animal/dist/mission-art/mount-dora/**'
      - '.github/workflows/mount-dora-house-parts.yml'
permissions:
  contents: read
concurrency:
  group: mount-dora-house-parts-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  house-parts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Check the house parts are what the town generates
        run: node tools/maps/house-parts/build-house-parts.mjs --check
      - name: Test the house parts, their round trip and the workshop receipt
        run: node --test tests/maps/house-parts.test.mjs
