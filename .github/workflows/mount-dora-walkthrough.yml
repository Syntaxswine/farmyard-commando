name: Mount Dora walking-tour acceptance
on:
  pull_request:
    branches: [main, codex/mount-dora-playable]
    paths:
      - 'sites/tactical-animal/**'
      - 'maps/mount-dora/**'
      - 'tools/test-mount-dora-walkthrough.mjs'
      - '.github/workflows/mount-dora-walkthrough.yml'
  push:
    branches: [codex/mount-dora-walkthrough]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mount-dora-walkthrough-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  walking-tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Check application and streamed town regressions
        run: npm run check
      - name: Build the real production game
        run: npm run build
      - name: Install locked browser dependencies
        run: npm ci --ignore-scripts --prefix sites/tactical-animal/browser-tests
      - name: Install isolated Chromium
        working-directory: sites/tactical-animal/browser-tests
        run: npx playwright install --with-deps chromium
      - name: Walk the production town with real desktop and phone controls
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/test-mount-dora-walkthrough.mjs
      - name: Verify temporary browser and server cleanup
        if: ${{ always() && hashFiles('artifacts/mount-dora-walkthrough/native/helper.json') != '' }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('artifacts/mount-dora-walkthrough/native/helper-cleanup.json')); if(!c.httpReleased||!c.wsReleased||!c.browserProcessExited||!Array.isArray(c.errors)||c.errors.length) throw Error('Native helper cleanup was not verified: '+JSON.stringify(c));"
      - name: Retain actual route, visual and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mount-dora-walkthrough-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/mount-dora-walkthrough/native
          retention-days: 14
