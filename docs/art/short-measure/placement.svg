idth="1.5"/><text x="202" y="647.6" fill="#f4e4b5" font-size="12" text-anchor="middle" font-weight="700">5</text><rect x="777" y="238.79999999999998" width="46" height="23" fill="url(#proposal)" stroke="#a55332" stroke-width="2" stroke-dasharray="5 3"/><circle cx="800" cy="250.29999999999998" r="10" fill="#28372e" stroke="#eee0b7" stroke-width="1.5"/><text x="800" y="254.29999999999998" fill="#f4e4b5" font-size="12" text-anchor="middle" font-weight="700">6</text><circle cx="156" cy="685" r="10" fill="#345d63" stroke="#eadbad" stroke-width="2"/><text x="156" y="713" fill="#263c34" font-size="11" text-anchor="middle" font-weight="700">ENTRY</text><circle cx="869" cy="685" r="10" fill="#406a4b" stroke="#eadbad" stroke-width="2"/><text x="869" y="713" fill="#263c34" font-size="11" text-anchor="middle" font-weight="700">EXIT</text><path d="M800 263l8 8-8 8-8-8Z" fill="#b45334" stroke="#ffebac" stroke-width="2"/><circle cx="363" cy="570" r="5" fill="#a53b29"/><circle cx="547" cy="386" r="5" fill="#a53b29"/><circle cx="754" cy="432" r="5" fill="#a53b29"/><text x="68" y="850" fill="#b4c1ad" font-size="13" >N ↑   x east / y south   ·   metres   ·   walls 2 m</text><text x="68" y="882" fill="#e8ddbf" font-size="14" >Dashed rust: proposed new collision. Olive: inherited cover. Numbers: art placements.</text><text x="68" y="908" fill="#e8ddbf" font-size="14" >Blue / ochre: approaches. Green: departure. Red diamond: mandatory manifest use point.</text><text x="68" y="943" fill="#d5b983" font-size="14" >Review cameras pan to the story props at the normal 13 m span; these are not spawn-camera captures.</text><text x="1015" y="120" fill="#e1bd7e" font-size="16" font-weight="700">ART / COLLISION CONTRACT</text><text x="1015" y="162" fill="#e8ddbf" font-size="15" font-weight="700">1  RIGGED RATION SCALE</text><text x="1015" y="185" fill="#c6b988" font-size="13" >worker-scale</text><text x="1015" y="208" fill="#b7c5ae" font-size="13" >1.7 × 1.1 m · height 1.72 m</text><text x="1015" y="229" fill="#d89d6a" font-size="12" >New solid / runtime binding required</text><text x="1015" y="267" fill="#e8ddbf" font-size="15" font-weight="700">2  INTACT FREIGHT SCALE</text><text x="1015" y="290" fill="#c6b988" font-size="13" >freight-scale</text><text x="1015" y="313" fill="#b7c5ae" font-size="13" >1.7 × 1.1 m · height 1.72 m</text><text x="1015" y="334" fill="#d89d6a" font-size="12" >New solid / runtime binding required</text><text x="1015" y="372" fill="#e8ddbf" font-size="15" font-weight="700">3  ARRIVAL FULL SACKS</text><text x="1015" y="395" fill="#c6b988" font-size="13" >sealed-load-arrival</text><text x="1015" y="418" fill="#b7c5ae" font-size="13" >1.5 × 1.25 m · height 0.95 m</text><text x="1015" y="439" fill="#d89d6a" font-size="12" >New solid / runtime binding required</text><text x="1015" y="477" fill="#e8ddbf" font-size="15" font-weight="700">4  SEALED LOAD / EXISTING COVER</text><text x="1015" y="500" fill="#c6b988" font-size="13" >sealed-load</text><text x="1015" y="523" fill="#b7c5ae" font-size="13" >2 × 2 m · height 1 m</text><text x="1015" y="544" fill="#d89d6a" font-size="12" >Replace visual only after binding</text><text x="1015" y="582" fill="#e8ddbf" font-size="15" font-weight="700">5  COLLAPSED WORKER SACKS</text><text x="1015" y="605" fill="#c6b988" font-size="13" >worker-empty-sacks</text><text x="1015" y="628" fill="#b7c5ae" font-size="13" >1.8 × 0.6 m · height 0.055 m</text><text x="1015" y="649" fill="#d89d6a" font-size="12" >Ground dressing / no collision</text><text x="1015" y="687" fill="#e8ddbf" font-size="15" font-weight="700">6  DISPATCH DESK + MANIFEST</text><text x="1015" y="710" fill="#c6b988" font-size="13" >shipping-manifest</text><text x="1015" y="733" fill="#b7c5ae" font-size="13" >2 × 1 m · height 1.05 m</text><text x="1015" y="754" fill="#d89d6a" font-size="12" >New solid / runtime binding required</text><text x="1015" y="825" fill="#e1bd7e" font-size="15" font-weight="700">UNCHANGED ANCHORS</text><text x="1015" y=